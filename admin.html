<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a1025">
<title>BLOSSOM | 관리자 센터</title>
<style>
:root{color-scheme:dark;--bg:#090d20;--panel:#161c3b;--pink:#f3a4f4;--blue:#76ddff;--text:#f5f3ff;--muted:#bbc3e8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#26225b 0,transparent 60%),var(--bg);font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:var(--text);min-height:100vh}a{color:inherit;text-decoration:none}.top{border-bottom:1px solid #7774d66b;background:#10142ee8}.wrap{max-width:1000px;margin:auto;padding:0 22px}.nav{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:25px;font-weight:900;font-style:italic;color:#ffd4ff;text-shadow:0 0 17px #c75cf5}.brand small{display:block;font-size:10px;letter-spacing:2px;color:#bfc5f6;font-style:normal}.back{color:var(--blue);font-size:14px}main{padding-top:45px;padding-bottom:70px}.eyebrow{font-size:12px;letter-spacing:3px;color:var(--blue);font-weight:800}h1{font-size:clamp(27px,4vw,43px);margin:12px 0}p{color:var(--muted);line-height:1.65}.panel{background:linear-gradient(135deg,#24254b,#131b38);border:1px solid #776bc4;border-radius:16px;padding:26px;margin-top:24px;box-shadow:0 9px 28px #02041470}.login{max-width:500px}.field{display:block;margin:17px 0 6px;font-size:14px;font-weight:700}input{width:100%;padding:14px;background:#101631;border:1px solid #6865a8;border-radius:9px;color:white;font-size:16px}input:focus{outline:2px solid #76ddff}button{cursor:pointer;color:white;border:1px solid #9e86fb;border-radius:9px;padding:12px 19px;background:linear-gradient(110deg,#6958bd,#b66ed7);font-weight:800;font-size:14px}button.secondary{background:#192346}button.danger{background:#652c56;border-color:#bb789f}button:disabled{opacity:.55;cursor:wait}.actions{display:flex;gap:8px;flex-wrap:wrap}.login button{margin-top:20px;width:100%}.muted{font-size:13px;color:var(--muted)}.message{min-height:24px;margin-top:15px;white-space:pre-wrap}.error{color:#ffb5c7}.success{color:#8df5c7}.hidden{display:none!important}.heading{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.member{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:19px 0;border-top:1px solid #555e9d}.member:first-child{border-top:0}.member strong{font-size:17px}.member small{display:block;color:var(--muted);margin-top:7px;line-height:1.5}.empty{padding:25px 0;color:var(--muted)}@media(max-width:600px){.panel{padding:18px}.member{align-items:flex-start;flex-direction:column}.member .actions{width:100%}.member button{flex:1}}
</style>
</head>
<body>
<header class="top"><div class="wrap nav"><a class="brand" href="index.html">✿ BLOSSOM<small>DIGITAL WORLD GUILD</small></a><a class="back" href="index.html">← 홈페이지</a></div></header>
<main class="wrap">
<div class="eyebrow">BLOSSOM MANAGEMENT</div>
<h1>✦ 관리자 센터</h1>
<p>승인된 최고관리자만 가입 신청을 확인하고 처리할 수 있습니다.</p>
<section id="loginPanel" class="panel login">
<h2>관리자 로그인</h2>
<form id="loginForm">
<label class="field" for="username">아이디</label><input id="username" name="username" autocomplete="username" required minlength="4" maxlength="20" placeholder="관리자 아이디">
<label class="field" for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="비밀번호">
<button id="loginButton" type="submit">로그인</button>
</form>
<p id="loginMessage" class="message" role="status" aria-live="polite"></p>
</section>
<section id="adminPanel" class="hidden">
<div class="panel"><div class="heading"><div><h2>가입 대기 회원</h2><p class="muted" id="welcome"></p></div><div class="actions"><button id="refreshButton" type="button" class="secondary">↻ 새로고침</button><button id="logoutButton" type="button" class="secondary">로그아웃</button></div></div><div id="members" aria-live="polite"></div><p id="adminMessage" class="message" role="status" aria-live="polite"></p></div>
</section>
</main>
<script>
'use strict';
const PROJECT='https://hweouohzkwqhiwwsjlxu.supabase.co';
const AUTH_URL=PROJECT+'/functions/v1/blossom-auth';
const ADMIN_URL=PROJECT+'/functions/v1/blossom-admin';
let accessToken='';
let pending=false;
const $=id=>document.getElementById(id);
function message(id,text,error=false){const el=$(id);el.textContent=text;el.className='message '+(error?'error':'success')}
async function post(url,body,token=''){
 const headers={'Content-Type':'application/json'};
 if(token)headers.Authorization='Bearer '+token;
 let response;
 try{response=await fetch(url,{method:'POST',headers,body:JSON.stringify(body),cache:'no-store'});}catch{throw Error('서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.');}
 let data;
 try{data=await response.json();}catch{throw Error('서버 응답을 읽을 수 없습니다.');}
 if(!response.ok||!data.success)throw Error(data.message||'요청을 처리하지 못했습니다.');
 return data;
}
function logout(note=''){
 accessToken='';
 $('loginForm').reset();
 $('loginPanel').classList.remove('hidden');
 $('adminPanel').classList.add('hidden');
 $('members').replaceChildren();
 message('loginMessage',note,!!note);
}
$('loginForm').addEventListener('submit',async event=>{
 event.preventDefault();
 if(pending)return;
 pending=true;$('loginButton').disabled=true;message('loginMessage','로그인 확인 중...');
 try{
  const data=await post(AUTH_URL,{action:'login',username:$('username').value.trim(),password:$('password').value});
  if(data.user?.role!=='site_owner'||data.user?.status!=='approved'||!data.session?.access_token){throw Error('최고관리자 계정만 접근할 수 있습니다.');}
  accessToken=data.session.access_token;
  $('password').value='';
  $('welcome').textContent=data.user.digimon_nickname+' · 최고관리자';
  $('loginPanel').classList.add('hidden');$('adminPanel').classList.remove('hidden');
  await loadPending();
 }catch(error){message($('adminPanel').classList.contains('hidden')?'loginMessage':'adminMessage',error.message,true)}
 finally{pending=false;$('loginButton').disabled=false;}
});
async function loadPending(){
 message('adminMessage','가입 대기 회원을 불러오는 중...');
 try{
  const data=await post(ADMIN_URL,{action:'pending'},accessToken);
  renderMembers(data.members||[]);
  message('adminMessage','목록을 갱신했습니다.');
 }catch(error){message('adminMessage',error.message,true);if(/권한|만료/.test(error.message))logout('관리자 인증이 만료되었거나 권한이 없습니다. 다시 로그인해 주세요.');}
}
function renderMembers(members){
 const container=$('members');container.replaceChildren();
 if(!members.length){const el=document.createElement('p');el.className='empty';el.textContent='현재 가입 대기 회원이 없습니다.';container.append(el);return;}
 for(const member of members){
  const item=document.createElement('div');item.className='member';
  const info=document.createElement('div');const name=document.createElement('strong');name.textContent=member.digimon_nickname||member.username;
  const detail=document.createElement('small');detail.textContent='아이디: '+member.username+' · 승인 대기';info.append(name,detail);
  const actions=document.createElement('div');actions.className='actions';
  const approve=document.createElement('button');approve.textContent='✓ 승인';approve.type='button';
  const reject=document.createElement('button');reject.textContent='✕ 거절';reject.type='button';reject.className='danger';
  approve.addEventListener('click',()=>review(member,'approve',approve,reject));
  reject.addEventListener('click',()=>review(member,'reject',approve,reject));
  actions.append(approve,reject);item.append(info,actions);container.append(item);
 }
}
async function review(member,decision,approve,reject){
 const verb=decision==='approve'?'승인':'거절';
 if(!confirm(member.username+' ('+(member.digimon_nickname||'')+') 회원을 '+verb+'하시겠습니까?'))return;
 approve.disabled=true;reject.disabled=true;message('adminMessage',verb+' 처리 중...');
 try{
  const data=await post(ADMIN_URL,{action:'review',member_id:member.id,decision},accessToken);
  await loadPending();message('adminMessage',data.message);
 }catch(error){message('adminMessage',error.message,true);approve.disabled=false;reject.disabled=false;}
}
$('refreshButton').addEventListener('click',loadPending);
$('logoutButton').addEventListener('click',()=>logout());
</script>
</body>
</html>
