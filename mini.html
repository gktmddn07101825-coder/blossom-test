<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLOSSOM | 버프 미니 타이머</title><link rel="stylesheet" href="blossom-skins.css"><style>
*{box-sizing:border-box}body{margin:0;padding:13px;min-height:100vh;background:radial-gradient(circle at 0% 0%,var(--mini-top,#4b427d),var(--mini-bottom,#090d20) 88%)!important;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#f8f7ff}a{color:var(--mini-accent,#9cecff);text-decoration:none}.head{display:flex;justify-content:space-between;align-items:center;gap:7px;flex-wrap:wrap}.brand{font-size:17px;font-weight:1000;color:var(--mini-accent,#d7b0ff)}.caption{color:#c1c9e6;font-size:11px;line-height:1.6}.chip{border:1px solid #706da2;padding:5px 10px;border-radius:9px;font-size:11px;color:#dbdef4;cursor:pointer;background:#111a35}.grid{display:grid;gap:8px;margin:14px 0}.buff{border-radius:12px;border:1px solid var(--mini-accent,#6e79ab);background:#0a122bb5;padding:12px;display:flex;align-items:center;gap:9px}.buff img{width:33px;height:33px;image-rendering:pixelated}.name{min-width:0;flex:1;word-break:break-all;font-weight:800;font-size:13px}.clock{font-weight:1000;color:var(--mini-accent,#86edff);font-variant-numeric:tabular-nums;font-size:19px;white-space:nowrap}.empty{padding:26px 12px;color:#c6d4f3;text-align:center;border:1px dashed #7783aa;border-radius:13px;font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.msg{color:#a3eace;font-size:11px;min-height:20px}.bottom{border-top:1px solid #ffffff30;padding-top:10px}.off{opacity:.65}.buff.off .clock{color:#c3c4df}html[data-blossom-timer="timer-rainbow"] .buff{border-image:linear-gradient(90deg,#ee8fae,#8cc7ff,#a0ffc1) 1}
.login-panel{margin:14px 0;padding:15px;border:1px solid #847dd2;border-radius:12px;background:#172044}.login-panel[hidden]{display:none!important}.login-panel h2{font-size:14px;margin:0 0 7px}.login-panel p{margin:0 0 11px}.login-panel label{display:block;font-size:12px;color:#d9ddf7;margin:8px 0}.login-panel input{display:block;width:100%;margin-top:5px;background:#0c1531;border:1px solid #777bb8;color:white;border-radius:8px;padding:10px;font:inherit}.login-panel button{width:100%;background:linear-gradient(110deg,#6857c6,#aa67d1);color:#fff;border:1px solid #b7a1eb;border-radius:9px;padding:10px;font-weight:bold;cursor:pointer}.msg.error{color:#ffb6bd}.bottom button{float:right}.chip{font:inherit}
</style><script src="blossom-session.js"></script><link rel="stylesheet" href="blossom-unified-nav.css?v=18">
<script defer src="blossom-unified-nav.js?v=18"></script>
</head><body><div class="head"><span class="brand">✿ BLOSSOM MINI TIMER</span><span><a href="timer.html">버프 설정 ↗</a> <button class="chip" type="button" id="refresh">새로고침</button></span></div><div class="caption">버프 타이머와 연동 · 별도 창에서도 남은 시간을 확인할 수 있어요.</div><div class="row" style="margin-top:12px"><span class="caption" id="userName">회원 확인 중...</span><span class="caption" id="count">—</span></div><form class="login-panel" id="miniLogin" hidden><h2>✿ 미니 타이머 로그인</h2><p class="caption">새 창에서는 기존 페이지의 로그인 정보가 공유되지 않을 수 있어요. 이 창에서 한 번 로그인해 주세요.</p><label>아이디<input id="miniUsername" autocomplete="username" maxlength="20" required></label><label>비밀번호<input id="miniPassword" type="password" autocomplete="current-password" required></label><button type="submit" id="miniLoginSubmit">로그인하고 버프 불러오기</button></form><div class="grid" id="list"><div class="empty">버프 불러오는 중...</div></div><div class="bottom"><div class="msg" id="message" role="status"></div><button type="button" class="chip" id="miniLogout">이 창 로그아웃</button><div class="caption">미니 타이머는 사이트 보조 화면이에요. 게임 키 입력 감지나 자동 조작은 하지 않습니다. 브라우저가 닫히면 별도 알림은 울리지 않습니다.</div></div><script defer src="blossom-skin.js"></script><script defer src="mini-app.js"></script></body></html>
