<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 블로썸 길드 버프 타이머</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #1a1528;
      color: #ffffff;
      font-family: 'Segoe UI', Malgun Gothic, sans-serif;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background-image: radial-gradient(#ffb7c5 0.5px, transparent 0.5px), radial-gradient(#ffb7c5 0.5px, #1a1528 0.5px);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
    }
    .container {
      width: 100%;
      max-width: 580px;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
      background: #2b1f3d;
      padding: 15px;
      border-radius: 12px;
      border: 3px solid #ff758c;
      box-shadow: 0 4px 0 #b33951;
    }
    header h1 {
      font-size: 1.5rem;
      color: #ff9a9e;
      margin-bottom: 4px;
      text-shadow: 1px 1px 0px #000;
    }
    header p {
      font-size: 0.8rem;
      color: #d1c4e9;
    }

    .controls-panel {
      background: #2b1f3d;
      padding: 12px 15px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border: 2px solid #ff758c;
      box-shadow: 0 3px 0 #b33951;
    }
    button, input, select {
      font-family: inherit;
      font-size: 0.85rem;
      padding: 6px 10px;
      border-radius: 6px;
      border: 2px solid #333;
      outline: none;
    }
    select {
      background: #1a1528;
      color: #fff;
      border-color: #554270;
      cursor: pointer;
    }
    .btn {
      background: #ff758c;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 0 #b33951;
      transition: 0.1s;
    }
    .btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }
    .btn-reset-all {
      background: #a18cd1;
      border-color: #7b52ae;
      box-shadow: 0 2px 0 #5c3d8a;
    }

    .timer-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }
    .timer-card {
      background: #2b1f3d;
      border-radius: 10px;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 3px solid #ff758c;
      box-shadow: 0 4px 0 #b33951;
    }
    .timer-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .buff-icon {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      background: #1a1528;
      border: 2px solid #ff9a9e;
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
    }
    .timer-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .timer-name {
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
    }
    .timer-sub {
      font-size: 0.75rem;
      color: #d1c4e9;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    /* 🎚️ 볼륨 슬라이더 바 스타일 */
    .volume-container {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      vertical-align: middle;
    }
    .volume-slider {
      width: 75px;
      height: 6px;
      background: #1a1528;
      border-radius: 3px;
      outline: none;
      border: 1px solid #554270;
      cursor: pointer;
      accent-color: #ff758c;
    }
    .volume-text {
      font-size: 0.7rem;
      color: #ff9a9e;
      min-width: 26px;
      text-align: right;
    }

    .timer-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .timer-display {
      font-size: 1.3rem;
      font-weight: bold;
      font-family: monospace;
      color: #00ffcc;
      min-width: 70px;
      text-align: right;
      text-shadow: 0 0 5px rgba(0,255,204,0.4);
    }
    .timer-display.ended {
      color: #ff5252;
      animation: blink 0.8s infinite;
      text-shadow: 0 0 5px rgba(255,82,82,0.6);
    }
    @keyframes blink {
      50% { opacity: 0.3; }
    }
    .btn-reset {
      background: #ff9a9e;
      color: #1a1528;
      border: 2px solid #d1435b;
      font-weight: bold;
      padding: 6px 10px;
      box-shadow: 0 2px 0 #b33951;
      cursor: pointer;
    }
    .btn-reset:active {
      transform: translateY(2px);
      box-shadow: none;
    }
    .btn-del {
      background: transparent;
      color: #ff758c;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-del:hover {
      color: #ff5252;
    }

    .edit-panel {
      background: #2b1f3d;
      padding: 12px 15px;
      border-radius: 10px;
      border: 2px solid #ff758c;
      box-shadow: 0 3px 0 #b33951;
    }
    .edit-panel h3 {
      font-size: 0.9rem;
      margin-bottom: 8px;
      color: #ff9a9e;
    }
    .form-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .form-group input, .form-group select {
      background: #1a1528;
      color: #fff;
      border-color: #554270;
    }
    .btn-add {
      background: #a18cd1;
      border-color: #7b52ae;
      color: white;
      box-shadow: 0 2px 0 #5c3d8a;
    }
  </style>
<style id="blossom-access-style">
html:not([data-blossom-access="approved"]) body > :not(#blossom-access-gate) { visibility: hidden !important; }
#blossom-access-gate { position:fixed; inset:0; z-index:2147483647; display:flex; align-items:center; justify-content:center; padding:20px; box-sizing:border-box; background:radial-gradient(circle at 50% 0%,#33215e,#0a1025 70%); color:#f5f3ff; font-family:'Malgun Gothic',sans-serif; text-align:center; visibility:visible !important; }
#blossom-access-gate .gate-card { width:min(440px,100%); background:linear-gradient(145deg,#24254b,#141b37); border:1px solid #8475d0; border-radius:20px; padding:34px 25px; box-shadow:0 15px 45px #0008; }
#blossom-access-gate h2 { color:#ffc9f5; font-size:25px; margin:12px 0; }
#blossom-access-gate p { line-height:1.8; color:#d0d7f6; }
#blossom-access-gate .gate-actions { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:25px; }
#blossom-access-gate .gate-actions a, #blossom-access-gate button { background:#6553b6; border:1px solid #a89af0; border-radius:10px; color:#fff; padding:13px 18px; font-size:14px; font-weight:800; text-decoration:none; cursor:pointer; font-family:inherit; }
#blossom-access-gate button { background:#293459; }
#blossom-access-gate button:disabled { opacity:.55; cursor:wait; }
html[data-blossom-access="approved"] #blossom-access-gate { display:none !important; }
</style></head>
<body><div id="blossom-access-gate" role="status" aria-live="polite"><div class="gate-card">
  <div style="font-size:33px;color:#f7b2f2">✿ BLOSSOM</div>
  <h2>길드원 전용 공간</h2>
  <p data-gate-message>회원 확인을 준비하고 있어요...</p>
  <div class="gate-actions"><a data-gate-login href="auth.html#login">로그인 / 회원가입</a><button type="button" data-gate-retry>다시 확인</button><a href="index.html">홈으로</a></div>
</div></div><script defer src="member-gate.js"></script>

  <div class="container">
    <header>
      <h1>🌸 블로썸 길드 버프 타이머</h1>
      <p>볼륨 슬라이더 바로 세밀하게 음량을 조절하세요!</p>
    </header>

    <div class="controls-panel">
      <button class="btn btn-reset-all" onclick="resetToGuildDefault()">🔄 길드 기본값 복원</button>
      <button class="btn" onclick="alert('브라우저에 개개인 설정이 안전하게 자동 저장됩니다!')">💾 설정 저장됨</button>
    </div>

    <div class="timer-list" id="timerContainer"></div>

    <div class="edit-panel">
      <h3>➕ 나만의 버프 추가하기</h3>
      <div class="form-group">
        <input type="text" id="newName" placeholder="버프 이름" style="flex: 2;">
        <input type="number" id="newSec" placeholder="시간(초)" style="width: 75px;">
        <select id="newSound" style="flex: 1.5;">
          <option value="alert.mp3">기본 알람</option>
          <option value="digivice.wav">디지바이스 1</option>
          <option value="digivice2.mp3">디지바이스 2</option>
        </select>
        <div style="display: flex; align-items: center; gap: 4px; background: #1a1528; padding: 2px 8px; border-radius: 6px; border: 2px solid #554270;">
          <span style="font-size:0.75rem; color:#ff9a9e;">🔊</span>
          <input type="range" id="newVolume" min="0" max="1" step="0.05" value="0.9" style="width: 60px; accent-color: #ff758c; cursor: pointer;">
        </div>
        <button class="btn btn-add" onclick="addCustomBuff()" style="flex: 1;">추가</button>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_PRESETS = [
      { id: 101, name: "도전의 가호", duration: 7200, icon: "Blessing.PNG", sound: "digivice.wav", volume: 0.9 },
      { id: 102, name: "슈퍼 증폭 부스터", duration: 3900, icon: "Booster.PNG", sound: "digivice2.mp3", volume: 0.9 },
      { id: 103, name: "통합 버프", duration: 3600, icon: "Integration.PNG", sound: "alert.mp3", volume: 0.9 }
    ];

    let userTimers = JSON.parse(localStorage.getItem('blossom_buff_settings_v4')) || ADMIN_PRESETS;
    let timerStates = {};

    function init() {
      renderTimers();
      setInterval(updateClocks, 100);
    }

    function saveSettings() {
      localStorage.setItem('blossom_buff_settings_v4', JSON.stringify(userTimers));
    }

    function renderTimers() {
      const container = document.getElementById('timerContainer');
      container.innerHTML = '';

      userTimers.forEach(t => {
        if (!timerStates[t.id]) {
          timerStates[t.id] = { endTime: null, isRunning: false, soundPlayed: false };
        }

        const currentVol = t.volume !== undefined ? t.volume : 0.9;
        const volPercent = Math.round(currentVol * 100);

        const card = document.createElement('div');
        card.className = 'timer-card';
        
        card.innerHTML = `
          <div class="timer-left">
            <img class="buff-icon" src="${t.icon || ''}" alt="icon" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="buff-icon" style="display:none;">🌸</div>
            <div class="timer-info">
              <div class="timer-name" contenteditable="true" onblur="updateBuffName(${t.id}, this)">${t.name}</div>
              <div class="timer-sub">
                시간: <span contenteditable="true" onblur="updateBuffDuration(${t.id}, this)">${t.duration}</span>초 | 
                알람: 
                <select onchange="updateBuffSound(${t.id}, this)">
                  <option value="alert.mp3" ${t.sound === 'alert.mp3' ? 'selected' : ''}>기본 알람</option>
                  <option value="digivice.wav" ${t.sound === 'digivice.wav' ? 'selected' : ''}>디지바이스 1</option>
                  <option value="digivice2.mp3" ${t.sound === 'digivice2.mp3' ? 'selected' : ''}>디지바이스 2</option>
                </select>
                <div class="volume-container">
                  <span>🔊</span>
                  <input type="range" class="volume-slider" min="0" max="1" step="0.05" value="${currentVol}" oninput="updateBuffVolume(${t.id}, this)">
                  <span class="volume-text" id="vol-text-${t.id}">${volPercent}%</span>
                </div>
              </div>
            </div>
          </div>
          <div class="timer-right">
            <div class="timer-display" id="display-${t.id}">READY</div>
            <button class="btn btn-reset" onclick="triggerTimer(${t.id})">리셋</button>
            <button class="btn-del" onclick="deleteBuff(${t.id})" title="삭제">✕</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function updateBuffName(id, el) {
      const buff = userTimers.find(t => t.id === id);
      if (buff) {
        buff.name = el.textContent.trim();
        saveSettings();
      }
    }

    function updateBuffDuration(id, el) {
      const buff = userTimers.find(t => t.id === id);
      if (buff) {
        const newSec = parseInt(el.textContent.trim());
        if (!isNaN(newSec) && newSec > 0) {
          buff.duration = newSec;
          saveSettings();
        } else {
          el.textContent = buff.duration;
        }
      }
    }

    function updateBuffSound(id, selectEl) {
      const buff = userTimers.find(t => t.id === id);
      if (buff) {
        buff.sound = selectEl.value;
        saveSettings();
        playAudio(buff.sound, buff.volume !== undefined ? buff.volume : 0.9);
      }
    }

    function updateBuffVolume(id, rangeEl) {
      const buff = userTimers.find(t => t.id === id);
      if (buff) {
        buff.volume = parseFloat(rangeEl.value);
        document.getElementById(`vol-text-${id}`).textContent = `${Math.round(buff.volume * 100)}%`;
        saveSettings();
      }
    }

    function triggerTimer(id) {
      const buff = userTimers.find(t => t.id === id);
      if (!buff) return;

      timerStates[id] = {
        endTime: Date.now() + buff.duration * 1000,
        isRunning: true,
        soundPlayed: false
      };
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function playAudio(filename, volume) {
      const audio = new Audio(filename);
      audio.volume = volume !== undefined ? volume : 0.9;
      audio.play().catch(e => {
        console.log("브라우저 자동 재생 정책 제한", e);
      });
    }

    function updateClocks() {
      const now = Date.now();
      userTimers.forEach(t => {
        const state = timerStates[t.id];
        const displayEl = document.getElementById(`display-${t.id}`);
        if (!displayEl) return;

        if (!state || !state.isRunning) {
          displayEl.textContent = "READY";
          displayEl.classList.remove('ended');
          return;
        }

        const remainMs = state.endTime - now;
        if (remainMs <= 0) {
          displayEndState(t, displayEl, state);
        } else {
          const remainSec = Math.ceil(remainMs / 1000);
          displayEl.textContent = formatTime(remainSec);
          displayEl.classList.remove('ended');
        }
      });
    }

    function displayEndState(t, displayEl, state) {
      displayEl.textContent = "END!";
      displayEl.classList.add('ended');
      if (!state.soundPlayed) {
        playAudio(t.sound || 'alert.mp3', t.volume !== undefined ? t.volume : 0.9);
      }
      state.soundPlayed = true;
    }

    function resetToGuildDefault() {
      if (confirm("길드 기본 디폴트 설정으로 초기화하시겠습니까?")) {
        userTimers = JSON.parse(JSON.stringify(ADMIN_PRESETS));
        timerStates = {};
        saveSettings();
        renderTimers();
      }
    }

    function addCustomBuff() {
      const name = document.getElementById('newName').value.trim();
      const duration = parseInt(document.getElementById('newSec').value);
      const sound = document.getElementById('newSound').value;
      const volume = parseFloat(document.getElementById('newVolume').value);

      if (!name || isNaN(duration) || duration <= 0) {
        alert("올바른 버프 이름과 시간(초)을 입력해주세요.");
        return;
      }

      const newBuff = {
        id: Date.now(),
        name: name,
        duration: duration,
        icon: '',
        sound: sound,
        volume: volume
      };

      userTimers.push(newBuff);
      saveSettings();
      renderTimers();

      document.getElementById('newName').value = '';
      document.getElementById('newSec').value = '';
    }

    function deleteBuff(id) {
      userTimers = userTimers.filter(t => t.id !== id);
      delete timerStates[id];
      saveSettings();
      renderTimers();
    }

    window.addEventListener('blossom:authorized', init, { once: true });
  </script>
</body>
</html>
